<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sortir à Sainté — Spectacles</title>

  <link rel="stylesheet" href="style.css?v=20260911-1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>
  <main class="page">
    <header class="header">
      <div class="brand-nav">
        <h1><a href="index.html" style="color: inherit; text-decoration: none;">Sortir à Sainté</a></h1>

        <nav class="main-nav" aria-label="Navigation principale">
          <a class="active" href="spectacles.html">Spectacles</a>
          <a href="expositions.html">Expositions</a>
          <a href="cinema.html">Ciné</a>
        </nav>
      </div>

      <div class="header-actions">
        <button id="loginBtn" type="button">Connexion</button>
      </div>
    </header>

    <section class="filters-top filters-top-single">
      <input
        id="search"
        type="search"
        placeholder="Rechercher un événement, un lieu..."
      />
    </section>

    <section class="multi-filters spectacles-filters">
      <div class="filter-group period-filter-group">
        <div class="filter-heading">
          <strong>Période</strong>
        </div>

        <div class="period-checkboxes">
          <label class="filter-check">
            <input
              id="period7"
              type="checkbox"
              value="7"
            />
            <span>7 prochains jours</span>
          </label>

          <label class="filter-check">
            <input
              id="period30"
              type="checkbox"
              value="30"
            />
            <span>30 prochains jours</span>
          </label>
        </div>

        <div class="period-help">
          Aucune case cochée = tout
        </div>
      </div>

      <div class="filter-group filter-group-wide">
        <div class="filter-heading">
          <strong>Catégories</strong>

          <button
            type="button"
            class="filter-clear"
            data-clear="categoryFilters"
          >
            Tout décocher
          </button>
        </div>

        <div
          id="categoryFilters"
          class="filter-options"
        ></div>
      </div>
    </section>

    <nav class="tabs" aria-label="Filtres d'état">
      <button class="tab active" type="button" data-tab="visible">
        À voir
      </button>

      <button class="tab" type="button" data-tab="favorites">
        Favoris
      </button>

      <button class="tab" type="button" data-tab="reserved">
        Réservés
      </button>

      <button class="tab" type="button" data-tab="hidden">
        Masqués
      </button>
    </nav>

    <div id="status" class="status"></div>
    <section id="events" class="events"></section>
  </main>

  <dialog id="loginDialog">
    <form method="dialog" class="login-form">
      <h2>Connexion</h2>

      <label>
        E-mail
        <input id="email" type="email" autocomplete="email" />
      </label>

      <div class="login-actions">
        <button id="sendMagicLink" type="button">
          Envoyer le lien magique
        </button>

        <button type="submit">
          Fermer
        </button>
      </div>

      <div id="loginMessage"></div>
    </form>
  </dialog>

  <script src="app.js?v=20260911-1"></script>
</body>
</html>
