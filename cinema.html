<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sortir à Sainté — Ciné</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cinema.css?v=20260920-1" />
</head>

<body>
  <main class="page">

    <header class="header">
      <div class="brand-nav">
        <h1>
          <a
            href="index.html"
            style="color: inherit; text-decoration: none;"
          >Sortir à Sainté</a>
        </h1>

        <nav class="main-nav" aria-label="Navigation principale">
          <a href="spectacles.html">Spectacles</a>
          <a href="expositions.html">Expositions</a>
          <a class="active" href="cinema.html">Ciné</a>
        </nav>
      </div>
    </header>

    <!-- FILTRES -->
    <div class="cinema-filter-bar">

      <div
        id="cinemaFilters"
        class="cinema-filter-list"
      ></div>

      <label class="after-work-filter">
        <input
          id="afterWorkOnly"
          type="checkbox"
          checked
        />
        <span>
          En semaine, masquer les séances avant 17h
        </span>
      </label>

    </div>

    <!-- MÉLIÈS -->
    <section class="cinema-main-section">

      <h2>Programmation Méliès</h2>

      <div
        id="cinemaMeliesPlanning"
        class="cinema-planning-wrap"
      ></div>

    </section>

    <!-- MÉGARAMA -->
    <section
      id="cinemaOccasionalSection"
      class="cinema-megarama-section"
    >

      <h2>Séances Mégarama</h2>

      <div
        id="cinemaOccasionalGrid"
        class="cinema-five-day-grid"
      ></div>

    </section>

    <!-- GROSSES SORTIES -->
    <section
      id="cinemaBigReleasesSection"
      class="cinema-big-releases-section"
    >
      <strong>Grosses sorties Mégarama :</strong>
      <span id="cinemaBigReleases"></span>
    </section>

  </main>

  <script src="cinema.js?v=20260920-1"></script>
</body>
</html>
