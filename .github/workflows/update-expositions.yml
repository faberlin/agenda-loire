
name: Mise à jour expositions

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Scraper les musées
        run: python scraper/musees.py

      - name: Enregistrer les changements
        run: |
          git config user.name "agenda-loire-bot"
          git config user.email "agenda-loire-bot@users.noreply.github.com"

          git add expositions.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mise à jour des expositions"
          git pull --rebase origin main
          git push origin main
