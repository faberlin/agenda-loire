name: Mise à jour cinéma

on:
  schedule:
    # Tous les jours à 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecter les séances cinéma
        run: python scraper/cinema.py

      - name: Publier les changements
        run: |
          git config user.name "agenda-loire-bot"
          git config user.email "agenda-loire-bot@users.noreply.github.com"

          git add cinema_events.json

          if [ -f telerama_debug.html ]; then
            git add telerama_debug.html
          fi

          if git diff --cached --quiet; then
            echo "Aucun changement à publier"
            exit 0
          fi

          git commit -m "Mise à jour des séances cinéma et diagnostic Télérama"
          git pull --rebase origin main
          git push origin main
