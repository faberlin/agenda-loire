name: Mise à jour des événements

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Scraper spécifique à lancer (ex: comedie_triomphe). Laisser vide pour tout exécuter."
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecter les événements
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            echo "Lancement du scraper ciblé : ${{ github.event.inputs.only }}"
            python scraper/main.py --only "${{ github.event.inputs.only }}"
          else
            echo "Lancement global de tous les scrapers"
            python scraper/main.py
          fi

      - name: Publier les changements
        run: |
          git config user.name "agenda-loire-bot"
          git config user.email "agenda-loire-bot@users.noreply.github.com"

          git add events.json cinema_events.json

          if git diff --cached --quiet; then
            echo "Aucun changement dans events.json"
            exit 0
          fi

          git commit -m "Mise à jour automatique des événements"

          git pull --rebase origin main
          git push origin main
