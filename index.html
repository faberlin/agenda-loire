<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agenda Loire</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Agenda Loire</h1>
      <p>Événements culturels dans la Loire</p>
    </div>
    <button id="loginBtn" class="secondary">Connexion</button>
  </header>

  <main>
    <section class="filters">
      <input id="search" type="search" placeholder="Rechercher un événement, un lieu…" />
      <select id="period">
        <option value="all">Toutes les dates</option>
        <option value="today">Aujourd’hui</option>
        <option value="week">7 prochains jours</option>
        <option value="weekend">Ce week-end</option>
        <option value="month">30 prochains jours</option>
      </select>
      <select id="category">
        <option value="all">Toutes les catégories</option>
      </select>
      <select id="venue">
        <option value="all">Toutes les salles / lieux</option>
      </select>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="visible">À voir</button>
      <button class="tab" data-tab="favorites">Favoris</button>
      <button class="tab" data-tab="reserved">Réservés</button>
      <button class="tab" data-tab="hidden">Masqués</button>
    </nav>

    <div id="status" class="status"></div>
    <section id="events" class="events"></section>
  </main>

  <dialog id="loginDialog">
    <form method="dialog" id="loginForm">
      <h2>Connexion</h2>
      <p>Entre ton adresse e-mail. Supabase t’enverra un lien de connexion.</p>
      <input id="email" type="email" placeholder="ton@email.fr" required />
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Annuler</button>
        <button id="sendMagicLink" value="default">Envoyer le lien</button>
      </div>
      <p id="loginMessage" class="small"></p>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
