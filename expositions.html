<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

<body>

      <div class="brand-nav">

        <nav class="main-nav" aria-label="Navigation principale">

    <section class="expo-filters" aria-label="Filtres">
      <strong>Afficher :</strong>

      <label class="expo-filter-check">
        <input id="filterMusees" type="checkbox" checked />
        <span>Musées</span>
      </label>

      <label class="expo-filter-check">
        <input id="filterGaleries" type="checkbox" checked />
        <span>Galeries</span>
      </label>

    <section class="expo-section">
      <h2>Expositions en cours</h2>
      <div id="currentExhibitions" class="expo-list"></div>
    </section>

    <section class="expo-section">
      <h2>À venir</h2>
      <div id="upcomingExhibitions" class="expo-list"></div>
    </section>

    <div id="expoStatus" class="expo-status"></div>

  <script src="expositions.js?v=20260909-1"></script>
